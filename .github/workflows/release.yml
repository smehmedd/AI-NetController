name: CST NetController AI — Build APK & EXE + Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v2.7.0)'
        required: true
        default: 'v2.7.0'

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Standalone Windows Agent (.EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Agent Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Run Agent Security & Edge-Case Verification
        run: |
          python agent/tests/test_all_edge_cases.py
          python agent/tests/test_host_diagnostics.py

      - name: Compile Standalone CST_HostAgent.exe
        working-directory: agent
        run: |
          pyinstaller --clean build_agent.spec
          if (Test-Path "dist/CST_HostAgent/CST_HostAgent.exe") {
            Copy-Item "dist/CST_HostAgent/CST_HostAgent.exe" "../CST_HostAgent_v2.7.0_win64.exe"
            Compress-Archive -Path "dist/CST_HostAgent/*" -DestinationPath "../CST_HostAgent_v2.7.0_win64_portable.zip" -Force
          } elseif (Test-Path "dist/CST_HostAgent.exe") {
            Copy-Item "dist/CST_HostAgent.exe" "../CST_HostAgent_v2.7.0_win64.exe"
          }

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-release
          path: |
            CST_HostAgent_v2.7.0_win64.exe
            CST_HostAgent_v2.7.0_win64_portable.zip

  build-android-apk:
    name: Build Release Android Mobile Client (.APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.29
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Split-per-ABI Release APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../CST_NetController_AI_v2.7.0_arm64-v8a.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: CST_NetController_AI_v2.7.0_arm64-v8a.apk

  publish-github-release:
    name: Publish Official GitHub Release with Patch Notes
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-release
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-release
          path: release-assets

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.release_tag || 'v2.7.0' }}
          name: "CST NetController AI ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.release_tag || 'v2.7.0' }} — Native APK & EXE Release"
          body_path: PATCH_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/CST_HostAgent_v2.7.0_win64.exe
            release-assets/CST_HostAgent_v2.7.0_win64_portable.zip
            release-assets/CST_NetController_AI_v2.7.0_arm64-v8a.apk
            release-assets/SHA256SUMS.txt
