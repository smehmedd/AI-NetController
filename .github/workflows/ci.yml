name: CST NetController AI CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-suite:
    name: Web Console Verification & Stress Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run lint

      - name: Execute 34-Pillar Verification & 13-Phase Stress Test Suite
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

  python-agent-suite:
    name: Python Agent Edge Cases & Host Diagnostics
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Execute Edge Case Verification Suite
        run: python agent/tests/test_all_edge_cases.py

      - name: Execute Host Diagnostics Harness
        run: python agent/tests/test_host_diagnostics.py
